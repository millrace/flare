# downloads — GETs returning buffered bodies of 4KB / 64KB / 1MB /
# 16MB (v0.5.0 Step 2 / Track 6.2).
#
# Exercises the buffered response-body write path at four sizes.
#
# Note this config is buffered by construction: these routes set
# Content-Length. The streaming write path (chunked, one pull per
# writable edge) is measured by ``sse_stream.yaml`` against
# ``buffered_4kb.yaml``; do not read a download number as a
# statement about streaming.
#
# The harness drives one path per config, so the four wrk_scripts
# below are not currently used -- run the sizes as separate configs
# if you need all four.
name: downloads
tool: wrk
url_path: /1mb
wrk_threads: 1
wrk_connections: 16
wrk_duration_seconds: 30
warmup_seconds: 10
runs: 5
quiet_seconds: 5
stdev_pct_gate: 5.0
# Each wrk_script in the list maps to a body size; the
# orchestrator runs each separately.
wrk_scripts:
  - benchmark/scripts/wrk_download_4kb.lua
  - benchmark/scripts/wrk_download_64kb.lua
  - benchmark/scripts/wrk_download_1mb.lua
  - benchmark/scripts/wrk_download_16mb.lua
