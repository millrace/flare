name: Fuzz

on:
  # Nightly schedule paused: fuzz targets need 'mozz', disabled in
  # pixi.toml during the mojo nightly bump (pins mojo ==1.0.0b1).
  # Re-enable this schedule when mozz has a nightly-compatible tag.
  # schedule:
  #   - cron: '0 2 * * *'   # nightly at 02:00 UTC
  workflow_dispatch:        # manual trigger from GitHub UI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Every ``run:`` step executes inside the ``flare`` checkout subdir so
    # the ``json = { path = "../json" }`` sibling dep (see the checkout +
    # setup step below) resolves to ``$GITHUB_WORKSPACE/json``.
    defaults:
      run:
        working-directory: flare
    strategy:
      fail-fast: false
      matrix:
        # Linux: pinned back to ``ubuntu-22.04`` (kernel 6.x, glibc
        # 2.35). On the latest ``ubuntu-latest`` runner image
        # (``ubuntu-24.04 / 20260413.86.1``, kernel 6.17.0, glibc
        # 2.39) the ``libKGENCompilerRTShared.so`` runtime crash that
        # was previously fixed in the pinned Mojo nightly
        # (``mojo == 1.0.0b1.dev2026042717``) reproduces again — the
        # fuzzer's tight mutate / JIT-execute loop trips it on the
        # very first run, before any harness work happens (see run
        # 25351119595). ``pixi run tests`` on the same image is
        # unaffected (CI doesn't drive the JIT hard enough), so
        # ``ci.yml`` stays on ``ubuntu-latest``. As with ci.yml, the
        # build side (sysroot pinned at glibc ``>=2.34`` via
        # conda-forge) keeps the resulting binaries portable down to
        # glibc 2.34 hosts. Revisit when the Mojo nightly grows a
        # fix, or when a future GHA image rolls a kernel that
        # doesn't trip the crash.
        os: [ubuntu-22.04, macos-14]

    steps:
      # flare's ``pixi.toml`` declares the millfolio ``json`` sibling lib as
      # a path dependency (``json = { path = "../json" }``), which the
      # ``fuzz`` environment (``features = ["dev", "fuzz"]``) inherits from
      # the base ``[dependencies]``. So the fuzz env can only solve when
      # ``json`` is checked out alongside flare. ``actions/checkout``'s
      # ``path`` must stay inside ``$GITHUB_WORKSPACE``, so — mirroring the
      # sibling layout in ``millfolio/vault``'s ``test.yml`` — flare goes
      # into ``flare/`` and ``json`` into ``json/`` (both under the
      # workspace root). ``../json`` then resolves from
      # ``$GITHUB_WORKSPACE/flare`` to ``$GITHUB_WORKSPACE/json``.
      # ``millfolio/json`` is a public repo, so no token is needed.
      - uses: actions/checkout@v4
        with:
          path: flare

      - uses: actions/checkout@v4
        with:
          repository: millfolio/json
          ref: main
          path: json

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          manifest-path: flare/pixi.toml
          environments: fuzz
          cache: false
          post-cleanup: false

      - name: Fuzz WS frame parser
        run: pixi run --environment fuzz fuzz-ws

      - name: Fuzz URL parser
        run: pixi run --environment fuzz fuzz-url

      - name: Fuzz HTTP headers parser
        run: pixi run --environment fuzz fuzz-headers

      - name: Fuzz HTTP response parser
        run: pixi run --environment fuzz fuzz-http-response

      - name: Fuzz HTTP server
        run: pixi run --environment fuzz fuzz-http-server

      - name: Fuzz WS server
        run: pixi run --environment fuzz fuzz-ws-server

      - name: Fuzz encoding
        run: pixi run --environment fuzz fuzz-encoding

      - name: Property tests — WS roundtrip
        run: pixi run --environment fuzz prop-ws

      - name: Property tests — HTTP headers
        run: pixi run --environment fuzz prop-headers

      - name: Property tests — Auth
        run: pixi run --environment fuzz prop-auth

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.os }}-${{ github.run_id }}
          path: flare/.mozz_crashes/
          if-no-files-found: ignore
